name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install deps
        working-directory: production-ai-app
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: production-ai-app
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: production-ai-app
        run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install deps
        working-directory: production-ai-app
        run: uv sync --group dev

      - name: Run tests
        working-directory: production-ai-app
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          LOG_FORMAT: console
        run: uv run pytest --cov --cov-report=xml -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: production-ai-app/coverage.xml
          flags: unittests
        continue-on-error: true

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install deps
        working-directory: production-ai-app
        run: uv sync --group dev

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Pip audit (dependency CVEs)
        working-directory: production-ai-app
        run: |
          uv pip install pip-audit
          uv run pip-audit --fix-dry-run
        continue-on-error: true

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: production-ai-app
          file: production-ai-app/app/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: production-ai-app:ci

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: production-ai-app:ci
          artifact-name: sbom.spdx.json
          output-file: sbom.spdx.json
