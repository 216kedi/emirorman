[project]
name = "production-ai-app"
version = "0.2.0"
description = "Production-grade RAG + agent platform (2026 stack)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "production-ai-app contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anyio>=4.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "tiktoken>=0.8",
    "sse-starlette>=2.1",
    "anthropic>=0.40",
    "openai>=1.55",
    "instructor>=1.7",
    "qdrant-client>=1.12",
    "redis>=5.2",
    "rank-bm25>=0.2.2",
    "mcp>=1.1",
    "orjson>=3.10",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "langfuse>=2.57",
    "slowapi>=0.1.9",
    "ragas>=0.2",
    "datasets>=3.0",
    "scipy>=1.14",
    "numpy>=2.1",
    "pandas>=2.2",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "pytest-httpx>=0.32",
    "faker>=30.0",
]

[dependency-groups]
eval = [
    "ragas>=0.2",
    "datasets>=3.0",
    "pandas>=2.2",
    "rich>=13.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "components",
    "services",
    "prompts",
    "agents",
    "security",
    "observability",
    "evaluation",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "evaluation/eval_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["app", "components", "services", "security", "prompts", "observability"]
omit = ["tests/*", "scripts/*", "evaluation/eval_results/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
