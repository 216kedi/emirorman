; Elis Evleri — ESP32 akıllı bina firmware'i
; Derleme:  pio run
; Yükleme:  pio run -t upload
; Monitör:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
